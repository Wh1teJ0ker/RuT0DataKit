# default_mask.yaml — v0.1.0 内置脱敏规则
#
# v0.1.0 重构后只使用通用算子 + 显式 params（用户要求「只做规则模版」）。
# 4 个通用脱敏算子：template / split_template / regex_replace / const_replace。
# 每条规则的全部参数（keep_prefix / keep_suffix / mask_char / mask_min_len /
# min_len / max_len / cjk 等）均显式声明，避免依赖预置别名。
#
# 每条规则带 `tags` 字段，供 RuleSet::by_tag_mask 按标签过滤；旧 YAML 不含
# tags 字段时默认空 Vec（serde 兼容）。常用标签：mask / validate / sensitive /
# search / sql_parse。
#
# 覆盖 sample_mask.csv 全部字段：
#   customer_id / name / id_card / phone / email / bank_card
maskers:
  # customer_id：8 字客户号 → 首字保留 + 中间 4 个 * 填充（≥2 字 guard）。
  - field: customer_id
    masker: template
    tags: [mask, sensitive]
    params:
      keep_prefix: 1
      keep_suffix: 0
      mask_char: "*"
      mask_min_len: 4
      min_len: 2
      cjk: false

  # name：中文姓名 cjk 分支（1 字原样、2 字 `首*`、≥3 字 `首+*(n-2)+末`）。
  - field: name
    masker: template
    tags: [mask, sensitive]
    params:
      keep_prefix: 1
      keep_suffix: 1
      mask_char: "*"
      mask_min_len: 1
      cjk: true

  # id_card：18 位身份证 → 保留前 6 + 后 4，中间 8 个 *；非 18 位原样返回。
  - field: id_card
    masker: template
    tags: [mask, sensitive]
    params:
      keep_prefix: 6
      keep_suffix: 4
      mask_char: "*"
      mask_min_len: 8
      min_len: 18
      max_len: 18
      cjk: false

  # phone：11 位手机号 → 保留前 3 + 后 4，中间 4 个 *；非 11 位原样返回。
  - field: phone
    masker: template
    tags: [mask, sensitive]
    params:
      keep_prefix: 3
      keep_suffix: 4
      mask_char: "*"
      mask_min_len: 4
      min_len: 11
      max_len: 11
      cjk: false

  # email：按 @ 切分，对本地部分走 cjk 分支（首尾各保留 1 字、中间 * 填充）。
  - field: email
    masker: split_template
    tags: [mask, sensitive]
    params:
      separator: "@"
      segment_index: 0
      keep_prefix: 1
      keep_suffix: 1
      mask_char: "*"
      mask_min_len: 1
      cjk: true

  # bank_card：16~19 位银行卡 → 保留前 6 + 后 4，中间 * 填充；9~15 位原样返回。
  - field: bank_card
    masker: template
    tags: [mask, sensitive]
    params:
      keep_prefix: 6
      keep_suffix: 4
      mask_char: "*"
      mask_min_len: 4
      min_len: 16
      max_len: 19
      cjk: false

# validators 为空；v0.1.0 GUI 校验入口由用户通过 RuleDrawer 自行配置。
# 内置校验样例可参考 list_tagged_presets("validate")，按需手填。
