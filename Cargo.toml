# RuT0DataKit workspace
#
# v1.0.0 框架阶段：仅交付脚手架骨架，不实现业务能力。
# 业务能力（脱敏/校验/提取/规则/搜索/Tools/PCAP）推迟 v1.1+。

[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["RuT0DataKit Team"]
license = "MIT"
repository = "https://github.com/Wh1teJ0ker/RuT0DataKit"

[workspace.dependencies]
ruT0-data-kit-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
