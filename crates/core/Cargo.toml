[package]
name = "ruT0-data-kit-core"
version.workspace = true
edition = "2021"
license = "MIT"
description = "RuT0DataKit processing engine (pure logic, no host dependencies)."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
csv = "1"
calamine = "0.26"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
