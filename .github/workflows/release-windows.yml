name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> src-tauri/target"

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --debug --locked

      - name: Build Tauri Windows bundle (nsis + msi)
        run: cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: RuT0DataKit-${{ github.ref_name || 'v0.8.0' }}-windows-x64-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: RuT0DataKit-${{ github.ref_name || 'v0.8.0' }}-windows-x64-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

      - name: Upload portable standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: RuT0DataKit-${{ github.ref_name || 'v0.8.0' }}-windows-x64-portable
          path: src-tauri/target/x86_64-pc-windows-msvc/release/RuT0DataKit.exe
          if-no-files-found: error
