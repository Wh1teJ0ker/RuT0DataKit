name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # tauri-action 负责：创建 draft Release → 四目标矩阵编译 → 产出安装包 + latest.json + 签名 → 上传资产 → finalize
  release:
    name: Build & Release (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
          - target: aarch64-apple-darwin
            runs-on: macos-14
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    env:
      CARGO_NET_RETRY: "5"
      RUSTUP_MAX_RETRIES: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --prefix frontend install --frozen-lockfile

      # 显式预构建前端：在 tauri-action 之前跑一次，提前暴露 vite 构建错误；
      # tauri-action 内部的 beforeBuildCommand 会再跑一次（幂等，dist 已存在时秒级完成）。
      - name: Pre-build frontend (safety net)
        run: pnpm --prefix frontend run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RuT0DataKit ${{ github.ref_name }}"
          releaseBody: "See [RELEASE-NOTES.md](docs/versions/1.0.0/RELEASE-NOTES.md) for details."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          updaterJsonPreferNsis: true

      # Windows：上传便携版 exe（无需安装，直接双击运行）
      # tauri-action 只上传安装包 (msi/nsis)，裸 exe 需手动上传
      # 注意：cargo workspace 根在仓库根（不在 src-tauri/），target 在仓库根
      - name: Upload portable exe (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "target/${{ matrix.target }}/release/ruT0-data-kit.exe"
          if (Test-Path $exe) {
            $new = "RuT0DataKit-${{ github.ref_name }}-windows-x64-portable.exe"
            Copy-Item $exe $new
            gh release upload "${{ github.ref_name }}" $new --repo "${{ github.repository }}" --clobber
            Write-Host "Uploaded portable: $new"
          } else {
            Write-Host "Portable exe not found at $exe, skipping"
          }
        shell: pwsh

  # tauri-action 默认产物名不含 linux/windows/mac 平台字样，
  # 这里在所有矩阵构建完成后统一重命名为 RuT0DataKit-<ver>-<platform>-<arch>.<ext>
  rename-assets:
    name: Rename assets with platform labels
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download → rename → re-upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$REPO" --clobber

          # 主产物重命名映射（按扩展名判定平台）
          # portable exe 已在上一步上传时就带平台名，跳过
          declare -A renamed
          for f in *; do
            case "$f" in
              *portable*)        echo "skip (already named): $f"; continue ;;
              *.deb)              new="RuT0DataKit-${TAG}-linux-x64.deb" ;;
              *.rpm)              new="RuT0DataKit-${TAG}-linux-x64.rpm" ;;
              *.AppImage.tar.gz)  new="RuT0DataKit-${TAG}-linux-x64.AppImage.tar.gz" ;;
              *.AppImage)         new="RuT0DataKit-${TAG}-linux-x64.AppImage" ;;
              *.dmg)              new="RuT0DataKit-${TAG}-mac-arm64.dmg" ;;
              *.app.tar.gz)       new="RuT0DataKit-${TAG}-mac-arm64.app.tar.gz" ;;
              *-setup.exe)        new="RuT0DataKit-${TAG}-windows-x64-setup.exe" ;;
              *.msi)              new="RuT0DataKit-${TAG}-windows-x64.msi" ;;
              *)                  echo "skip: $f"; continue ;;
            esac
            renamed["$f"]="$new"
          done

          # 签名文件跟随主产物
          for f in *.sig; do
            [ -f "$f" ] || continue
            base="${f%.sig}"
            if [ -n "${renamed[$base]:-}" ]; then
              renamed["$f"]="${renamed[$base]}.sig"
            fi
          done

          # 执行：删除旧资产 + 本地改名
          for old in "${!renamed[@]}"; do
            new="${renamed[$old]}"
            echo "$old → $new"
            gh release delete-asset "$TAG" "$old" --repo "$REPO" --yes
            mv "$old" "$new"
          done

          # 上传改名后的资产
          gh release upload "$TAG" * --repo "$REPO"
