name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # tauri-action 负责：创建 draft Release → 四目标矩阵编译 → 产出安装包 + latest.json + 签名 → 上传资产 → finalize
  release:
    name: Build & Release (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
          - target: aarch64-apple-darwin
            runs-on: macos-14
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    env:
      CARGO_NET_RETRY: "5"
      RUSTUP_MAX_RETRIES: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --prefix frontend install --frozen-lockfile

      # 显式预构建前端：在 tauri-action 之前跑一次，提前暴露 vite 构建错误；
      # tauri-action 内部的 beforeBuildCommand 会再跑一次（幂等，dist 已存在时秒级完成）。
      - name: Pre-build frontend (safety net)
        run: pnpm --prefix frontend run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RuT0DataKit ${{ github.ref_name }}"
          releaseBody: "See [RELEASE-NOTES.md](docs/versions/1.1.0/RELEASE-NOTES.md) for details."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          updaterJsonPreferNsis: true

      # Windows：上传便携版 exe（无需安装，直接双击运行）
      # tauri-action 只上传安装包 (msi/nsis)，裸 exe 需手动上传
      # 注意：cargo workspace 根在仓库根（不在 src-tauri/），target 在仓库根
      - name: Upload portable exe (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "target/${{ matrix.target }}/release/ruT0-data-kit.exe"
          if (Test-Path $exe) {
            $new = "RuT0DataKit-${{ github.ref_name }}-windows-x64-portable.exe"
            Copy-Item $exe $new
            gh release upload "${{ github.ref_name }}" $new --repo "${{ github.repository }}" --clobber
            Write-Host "Uploaded portable: $new"
          } else {
            Write-Host "Portable exe not found at $exe, skipping"
          }
        shell: pwsh
